<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c4560c">
<title>รายงานเวรประจำวัน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="https://raw.githubusercontent.com/phiman-2026/picture/main/logo%20phiman.png">
<style>
/* =========================================================
   CONFIG — วาง URL ของ Web App (ลงท้าย /exec) ใน API_URL ด้านล่าง (ส่วน <script>)
   ========================================================= */
@font-face{font-family:'PSK';src:local('TH SarabunPSK'),local('THSarabunPSK');font-weight:400;size-adjust:138%}
@font-face{font-family:'PSK';src:local('TH SarabunPSK Bold'),local('THSarabunPSK-Bold');font-weight:700;size-adjust:138%}
:root{
  --bg:#f6f0e6; --bg-2:#efe4d2;
  --surface:#fffdf8; --surface-2:#fbf5ea; --surface-3:#f5ecdc;
  --ink:#2a2016; --ink-2:#5a4a38; --muted:#8b7b67;
  --line:rgba(122,90,40,.16); --line-2:rgba(122,90,40,.28);
  --orange:#e0701c; --orange-2:#bf540c; --orange-soft:#fdebd8;
  --gold:#c9972f; --gold-2:#e8c36a; --gold-soft:#fbf0d2;
  --silver:#aeb3bb; --silver-2:#e7e9ed;
  --green:#14935a; --green-soft:#e2f5ea;
  --yellow:#c98d00; --yellow-soft:#fff3cf;
  --red:#cf3b3b; --red-soft:#fde6e4;
  --metal-gold:linear-gradient(135deg,#7a4e0d 0%,#c9972f 20%,#f7df9a 40%,#d2a03c 56%,#f4d98e 74%,#8c5d15 100%);
  --metal-orange:linear-gradient(135deg,#9a3d07 0%,#d9631a 26%,#f5a24f 48%,#e3741f 64%,#b44b0a 100%);
  --metal-silver:linear-gradient(135deg,#8e949d 0%,#e8ebef 32%,#ffffff 48%,#c6cbd2 66%,#9da3ab 100%);
  --edge:linear-gradient(150deg,rgba(255,255,255,.95),rgba(201,151,47,.55) 42%,rgba(174,179,187,.45) 70%,rgba(255,255,255,.7));
  --sh-sm:0 2px 3px -1px rgba(0,0,0,.08),0 1px 0 0 rgba(25,28,33,.02),0 0 0 1px rgba(60,40,10,.06);
  --sh-md:0 0 0 1px rgba(60,40,10,.05),0 1px 1px -.5px rgba(60,40,10,.06),0 3px 3px -1.5px rgba(60,40,10,.06),0 6px 6px -3px rgba(60,40,10,.06),0 12px 12px -6px rgba(60,40,10,.06),0 24px 24px -12px rgba(60,40,10,.07);
  --sh-lg:0 2.8px 2.2px rgba(60,30,0,.034),0 6.7px 5.3px rgba(60,30,0,.048),0 12.5px 10px rgba(60,30,0,.06),0 22.3px 17.9px rgba(60,30,0,.072),0 41.8px 33.4px rgba(60,30,0,.086),0 100px 80px rgba(60,30,0,.12);
  --r:22px; --r-sm:14px;
  /* TH SarabunPSK (ถ้ามีในเครื่อง) → Sarabun จาก Google Fonts (ชุดตัวอักษรเดียวกัน ใช้บนมือถือ/เครื่องที่ไม่มี PSK) */
  --font:'PSK','Sarabun',system-ui,sans-serif;
  --serif:'PSK','Sarabun',system-ui,sans-serif;
  --spring:cubic-bezier(.2,.9,.25,1);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;font-family:var(--font);color:var(--ink);font-size:17px;line-height:1.6;
  background:
    radial-gradient(1100px 520px at -10% -10%,rgba(240,150,60,.20),transparent 60%),
    radial-gradient(900px 500px at 110% 0%,rgba(222,182,90,.22),transparent 60%),
    radial-gradient(800px 600px at 50% 120%,rgba(190,196,206,.30),transparent 60%),
    var(--bg);
  background-attachment:fixed;min-height:100vh;
}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.hidden{display:none!important}
.serif{font-family:var(--serif)}

/* ---------- surfaces ---------- */
.card{
  position:relative;border:1px solid transparent;border-radius:var(--r);
  background:linear-gradient(var(--surface),var(--surface)) padding-box,var(--edge) border-box;
  box-shadow:var(--sh-md);padding:22px;
}
.card+.card{margin-top:18px}
.card-h{display:flex;align-items:center;gap:12px;justify-content:space-between;margin:-2px 0 16px;flex-wrap:wrap}
.card-h h2{margin:0;font-family:var(--serif);font-size:1.18rem;font-weight:600;letter-spacing:-.005em}
.card-h .sub{color:var(--muted);font-size:.88rem}
.eyebrow{font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600}

/* ---------- topbar ---------- */
.topbar{
  position:sticky;top:0;z-index:30;
  background:rgba(255,251,244,.72);backdrop-filter:blur(18px) saturate(170%);-webkit-backdrop-filter:blur(18px) saturate(170%);
  border-bottom:1px solid rgba(201,151,47,.22);
}
.topbar::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,rgba(201,151,47,.7),rgba(255,255,255,.9),rgba(201,151,47,.7),transparent)}
.tb-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.brand .t1{font-family:var(--serif);font-weight:700;font-size:1.02rem;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .t2{font-size:.78rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.emblem{width:42px;height:42px;flex:none;filter:drop-shadow(0 3px 6px rgba(120,70,0,.25))}
.userchip{display:flex;align-items:center;gap:10px;padding:5px 6px 5px 14px;border-radius:999px;cursor:pointer;border:1px solid transparent;
  background:linear-gradient(#fffaf1,#fffaf1) padding-box,var(--edge) border-box;box-shadow:var(--sh-sm);transition:transform .15s var(--spring)}
.userchip:active{transform:scale(.97)}
.userchip .nm{font-size:.86rem;font-weight:600;max-width:190px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:.9rem;background:var(--metal-orange);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 0 0 2px #fff,0 0 0 3px rgba(201,151,47,.6)}

/* ---------- nav ---------- */
.nav{max-width:1180px;margin:0 auto;padding:14px 16px 0;}
.seg{display:flex;gap:6px;padding:6px;border-radius:18px;overflow-x:auto;scrollbar-width:none;
  background:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,.55)) padding-box,linear-gradient(150deg,rgba(255,255,255,.9),rgba(174,179,187,.5)) border-box;
  border:1px solid transparent;box-shadow:inset 0 1px 2px rgba(80,50,10,.06)}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;border:0;background:transparent;padding:9px 16px;border-radius:13px;cursor:pointer;color:var(--ink-2);font-weight:500;font-size:.92rem;white-space:nowrap;display:flex;align-items:center;gap:8px;transition:background .2s,color .2s,transform .12s}
.seg button:active{transform:scale(.97)}
.seg button svg{width:17px;height:17px;opacity:.75}
.seg button.on{color:#fff;background:var(--metal-orange);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 4px 12px -4px rgba(190,84,12,.6)}
.seg button.on svg{opacity:1}

main{max-width:1180px;margin:0 auto;padding:18px 16px 60px}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;border-radius:28px;padding:26px 26px 24px;color:#fff;isolation:isolate;
  background:
    radial-gradient(600px 240px at 85% -20%,rgba(255,230,160,.55),transparent 60%),
    radial-gradient(500px 300px at -10% 120%,rgba(120,40,0,.45),transparent 60%),
    linear-gradient(125deg,#9c3f08 0%,#d4621a 32%,#e9933b 58%,#c9972f 100%);
  box-shadow:var(--sh-lg),inset 0 1px 0 rgba(255,255,255,.35);
}
.hero::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;pointer-events:none;
  background:linear-gradient(140deg,rgba(255,244,200,.95),rgba(255,255,255,.15) 35%,rgba(255,215,130,.8) 65%,rgba(255,255,255,.2));
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);mask-composite:exclude}
.hero::after{content:"";position:absolute;top:-50%;left:-60%;width:40%;height:200%;z-index:-1;pointer-events:none;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.28),transparent);transform:rotate(18deg);animation:sheen 2.4s .3s var(--spring) 1 both}
@keyframes sheen{from{left:-60%}to{left:130%}}
.hero .ring{position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;border:1px solid rgba(255,235,190,.35);z-index:-1}
.hero .ring.r2{right:-20px;top:-20px;width:180px;height:180px}
.hero-top{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start}
.hero h1{margin:4px 0 2px;font-family:var(--serif);font-size:clamp(1.35rem,3.6vw,1.9rem);line-height:1.25;letter-spacing:-.01em;font-weight:600;text-shadow:0 1px 1px rgba(80,30,0,.35)}
.hero .date{opacity:.95;font-size:.98rem}
.clock{font-variant-numeric:tabular-nums;font-size:clamp(1.8rem,5vw,2.6rem);font-weight:600;letter-spacing:-.02em;line-height:1;text-shadow:0 2px 6px rgba(80,30,0,.35)}
.clock small{font-size:.42em;opacity:.85;margin-left:4px;font-weight:500}
.hero-status{margin-top:20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hero-note{font-size:.95rem;opacity:.95}
.glass{background:rgba(255,255,255,.16);border:1px solid rgba(255,240,210,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:14px;padding:8px 14px}

/* ---------- status pill ---------- */
.pill{display:inline-flex;align-items:center;gap:8px;padding:6px 14px 6px 10px;border-radius:999px;font-weight:600;font-size:.86rem;white-space:nowrap;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(0,0,0,.08),0 2px 6px -2px rgba(0,0,0,.25)}
.pill .dot{width:9px;height:9px;border-radius:50%;background:currentColor;box-shadow:0 0 0 3px rgba(255,255,255,.35)}
.pill.lg{font-size:1.02rem;padding:9px 20px 9px 14px}
.pill.lg .dot{width:11px;height:11px}
.st-done{color:#fff;background:linear-gradient(180deg,#3cc983,#14935a 60%,#0e7a49)}
.st-pending{color:#4a3300;background:linear-gradient(180deg,#ffe58a,#f4c23a 60%,#dda611)}
.st-overdue{color:#fff;background:linear-gradient(180deg,#f07a72,#d23f3f 60%,#b12f2f)}
.st-normal{color:#3d4450;background:var(--metal-silver)}
.st-upcoming{color:#5a4a38;background:linear-gradient(180deg,#fff7e6,#f1dfbd)}
.st-done .dot,.st-overdue .dot{background:#fff}
.st-pending .dot{background:#8a5a00}
.st-normal .dot{background:#7c838e}
.st-pending.live .dot,.st-overdue.live .dot{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(255,255,255,0)}}

/* ---------- buttons ---------- */
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer;
  padding:11px 20px;border-radius:14px;font-weight:600;font-size:.95rem;transition:transform .12s var(--spring),box-shadow .2s,filter .2s;white-space:nowrap;text-decoration:none}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn svg{width:18px;height:18px}
.btn-primary{color:#fff;background:var(--metal-orange);border:1px solid rgba(150,60,0,.45);
  box-shadow:inset 0 1px 0 rgba(255,236,200,.7),inset 0 -2px 0 rgba(100,30,0,.25),0 8px 18px -8px rgba(190,84,12,.75);text-shadow:0 1px 1px rgba(90,30,0,.35)}
.btn-primary:hover{filter:brightness(1.06) saturate(1.05)}
.btn-gold{color:#3d2a05;background:var(--metal-gold);border:1px solid rgba(130,90,10,.45);
  box-shadow:inset 0 1px 0 rgba(255,250,220,.85),inset 0 -2px 0 rgba(100,60,0,.2),0 8px 18px -8px rgba(160,110,20,.7)}
.btn-silver{color:#2f343b;background:var(--metal-silver);border:1px solid rgba(110,116,125,.4);box-shadow:inset 0 1px 0 #fff,0 4px 10px -6px rgba(0,0,0,.35)}
.btn-ghost{background:transparent;color:var(--ink-2);border:1px solid var(--line-2)}
.btn-ghost:hover{background:rgba(201,151,47,.08)}
.btn-danger{color:#fff;background:linear-gradient(180deg,#ec6b63,#c73434);border:1px solid rgba(130,20,20,.4);box-shadow:inset 0 1px 0 rgba(255,220,220,.6)}
.btn-sm{padding:7px 12px;font-size:.85rem;border-radius:11px}
.btn-icon{padding:8px;border-radius:11px}
.btn-block{width:100%}
.btn-primary::after,.btn-gold::after{content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-18deg);transition:left .7s var(--spring)}
.btn-primary:hover::after,.btn-gold:hover::after{left:130%}

/* ---------- forms ---------- */
label.f{display:block;font-size:.86rem;font-weight:600;color:var(--ink-2);margin:0 0 6px}
.input,select.input,textarea.input{width:100%;padding:11px 14px;border-radius:13px;border:1px solid var(--line-2);background:#fffdfa;outline:none;
  box-shadow:inset 0 1px 2px rgba(80,50,10,.06);transition:border-color .15s,box-shadow .15s}
.input:focus{border-color:var(--orange);box-shadow:0 0 0 4px rgba(224,112,28,.16),inset 0 1px 2px rgba(80,50,10,.06)}
textarea.input{min-height:78px;resize:vertical}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:760px){.g2,.g3{grid-template-columns:1fr}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.hint{font-size:.82rem;color:var(--muted)}

/* choice segmented */
.choice{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice input{position:absolute;opacity:0;pointer-events:none}
.choice label{display:flex;align-items:center;justify-content:center;gap:8px;padding:11px 10px;border-radius:13px;cursor:pointer;font-weight:600;font-size:.92rem;
  border:1px solid var(--line-2);background:#fffdfa;transition:all .18s var(--spring);text-align:center}
.choice label:active{transform:scale(.98)}
.choice input:focus-visible+label{outline:3px solid rgba(224,112,28,.35);outline-offset:2px}
.choice input.ok:checked+label{color:#fff;border-color:#0e7a49;background:linear-gradient(180deg,#3cc983,#14935a);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 6px 14px -8px #14935a}
.choice input.no:checked+label{color:#fff;border-color:#a32b2b;background:linear-gradient(180deg,#f07a72,#cf3b3b);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 6px 14px -8px #cf3b3b}

/* ---------- duty items ---------- */
.duty{border-radius:18px;padding:16px;background:var(--surface-2);border:1px solid var(--line);position:relative}
.duty+.duty{margin-top:12px}
.duty-h{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.duty-idx{flex:none;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-weight:700;color:#3d2a05;background:var(--metal-gold);box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 3px 8px -4px rgba(120,80,0,.6)}
.duty-name{font-weight:600;line-height:1.35}
.time{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;color:var(--ink-2);padding:2px 10px;border-radius:999px;background:#fff;border:1px solid var(--line);margin-top:4px;font-variant-numeric:tabular-nums}
.time svg{width:13px;height:13px;color:var(--orange)}

/* signature */
.sigbox{position:relative;border-radius:18px;padding:1.5px;background:var(--metal-gold);box-shadow:var(--sh-sm)}
.sigbox canvas{display:block;width:100%;height:190px;border-radius:16.5px;touch-action:none;cursor:crosshair;
  background:
    linear-gradient(transparent 74%,rgba(201,151,47,.35) 74%,rgba(201,151,47,.35) calc(74% + 1px),transparent calc(74% + 1px)),
    repeating-linear-gradient(0deg,transparent 0 23px,rgba(120,90,40,.04) 23px 24px),
    #fffef9}
.sigbox .ph{position:absolute;inset:0;display:grid;place-items:center;color:rgba(139,123,103,.6);pointer-events:none;font-family:var(--serif);font-size:1.05rem;transition:opacity .2s}
.sigimg{max-width:100%;height:auto;max-height:120px;display:block}
.sig-thumb{height:42px;max-width:150px;object-fit:contain;cursor:zoom-in;border-radius:8px;background:#fffef9;border:1px solid var(--line);padding:2px 6px}

/* week */
.week{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
@media(max-width:760px){.week{grid-template-columns:1fr}}
.wday{border-radius:16px;padding:12px;background:var(--surface-2);border:1px solid var(--line);min-height:84px}
.wday.today{background:linear-gradient(var(--gold-soft),var(--gold-soft)) padding-box,var(--metal-gold) border-box;border:1.5px solid transparent}
.wday h4{margin:0 0 8px;font-size:.9rem;display:flex;justify-content:space-between;align-items:center}
.wday .tag{font-size:.7rem;font-weight:700;color:#fff;background:var(--metal-orange);padding:1px 8px;border-radius:999px}
.wday ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.wday li{font-size:.8rem;line-height:1.35;padding:6px 8px;border-radius:9px;background:#fff;border:1px solid var(--line)}
.wday li b{display:block;font-size:.72rem;color:var(--orange-2);font-variant-numeric:tabular-nums}
.wday .none{font-size:.8rem;color:var(--muted)}

/* list & table */
.tbl-wrap{overflow-x:auto;border-radius:16px;border:1px solid var(--line);background:#fffdf9}
table.tbl{width:100%;border-collapse:collapse;font-size:.9rem}
.tbl th{position:sticky;top:0;text-align:left;font-weight:600;font-size:.8rem;color:var(--ink-2);padding:11px 12px;background:linear-gradient(180deg,#fbf3e3,#f3e6cc);border-bottom:1px solid var(--line-2);white-space:nowrap}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl tr:hover td{background:rgba(201,151,47,.05)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.b-admin{color:#fff;background:var(--metal-orange)}
.b-dayadmin{color:#3d2a05;background:var(--metal-gold)}
.b-user{color:#3d4450;background:var(--metal-silver)}
.b-late{color:var(--red);background:var(--red-soft)}
.b-no{color:var(--red);background:var(--red-soft)}
.b-ok{color:var(--green);background:var(--green-soft)}
.muted{color:var(--muted)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media(max-width:760px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{border-radius:18px;padding:14px 16px;background:linear-gradient(#fffdf8,#fffdf8) padding-box,var(--edge) border-box;border:1px solid transparent;box-shadow:var(--sh-sm);position:relative;overflow:hidden}
.stat .k{font-size:.8rem;color:var(--muted);font-weight:500}
.stat .v{font-size:1.9rem;font-weight:700;letter-spacing:-.02em;line-height:1.15;font-variant-numeric:tabular-nums}
.stat::after{content:"";position:absolute;right:-18px;top:-18px;width:70px;height:70px;border-radius:50%;opacity:.16}
.stat.s-all .v{color:var(--ink)} .stat.s-all::after{background:var(--metal-silver);opacity:.6}
.stat.s-done .v{color:var(--green)} .stat.s-done::after{background:var(--green)}
.stat.s-pending .v{color:var(--yellow)} .stat.s-pending::after{background:var(--yellow)}
.stat.s-overdue .v{color:var(--red)} .stat.s-overdue::after{background:var(--red)}
.progress{height:10px;border-radius:999px;background:var(--surface-3);overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.08)}
.progress i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#14935a,#3cc983);box-shadow:inset 0 1px 0 rgba(255,255,255,.5);transition:width .6s var(--spring)}

/* point groups */
.pgroup{border-radius:18px;border:1px solid var(--line);overflow:hidden;background:#fffdf9}
.pgroup+.pgroup{margin-top:14px}
.pgroup-h{display:flex;align-items:center;gap:10px;padding:11px 14px;background:linear-gradient(180deg,#fbf3e3,#f5e9d2);border-bottom:1px solid var(--line)}
.pgroup-h{flex-wrap:wrap}
.pgroup-h .nm{font-weight:600;flex:1 1 220px;min-width:0}
.prow{display:grid;grid-template-columns:minmax(170px,1.3fr) auto minmax(150px,1.6fr) auto auto;gap:12px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow .who{font-weight:500}
.prow .det{font-size:.85rem;color:var(--ink-2)}
@media(max-width:820px){.prow{grid-template-columns:1fr auto}.prow .det{grid-column:1/-1}.prow .sigcell{grid-column:1/2}}

/* chips (schedule) */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 6px 5px 12px;border-radius:999px;font-size:.86rem;background:#fff;border:1px solid var(--line-2);box-shadow:var(--sh-sm)}
.chip button{border:0;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;cursor:pointer;background:var(--surface-3);color:var(--ink-2)}
.chip button:hover{background:var(--red-soft);color:var(--red)}
.chip button svg{width:12px;height:12px}

/* empty */
.empty{text-align:center;padding:34px 16px;color:var(--muted)}
.empty .ic{width:64px;height:64px;margin:0 auto 10px;border-radius:20px;display:grid;place-items:center;background:var(--metal-silver);box-shadow:var(--sh-sm)}
.empty .ic svg{width:30px;height:30px;color:#6b727c}

/* filters */
.fchips{display:flex;gap:6px;flex-wrap:wrap}
.fchips button{border:1px solid var(--line-2);background:#fffdfa;border-radius:999px;padding:6px 13px;font-size:.84rem;cursor:pointer;color:var(--ink-2);display:inline-flex;gap:6px;align-items:center}
.fchips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.fchips .c{font-variant-numeric:tabular-nums;opacity:.8}

/* ---------- login ---------- */
.login{min-height:100vh;display:grid;place-items:center;padding:28px 16px}
.login-card{width:100%;max-width:440px;padding:34px 28px 28px;border-radius:30px;border:1.5px solid transparent;
  background:linear-gradient(rgba(255,253,248,.88),rgba(255,253,248,.88)) padding-box,linear-gradient(150deg,#fff,#d6a548 35%,#f7e3a8 55%,#b8bdc5 80%,#fff) border-box;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--sh-lg);text-align:center;
  animation:rise .7s var(--spring) both}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.login .emblem{width:92px;height:92px;margin:-4px auto 10px;display:block}
.login h1{font-family:var(--serif);font-size:1.5rem;line-height:1.3;margin:6px 0 2px;letter-spacing:-.01em;
  background:linear-gradient(120deg,#8a3a06,#d8661c 40%,#b8862a 75%,#7a4e0d);-webkit-background-clip:text;background-clip:text;color:transparent}
.login .school{color:var(--ink-2);font-weight:500}
.login form{text-align:left;margin-top:24px;display:grid;gap:14px}
.divider{height:1px;margin:20px 0 14px;background:linear-gradient(90deg,transparent,rgba(201,151,47,.6),transparent)}
.demo-box{margin-top:16px;padding:14px;border-radius:16px;background:var(--gold-soft);border:1px dashed rgba(201,151,47,.7);text-align:left;font-size:.85rem}
.demo-box .row{margin-top:8px}
.pw-wrap{position:relative}
.pw-wrap button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;padding:6px;cursor:pointer;color:var(--muted)}

/* ---------- modal & toast ---------- */
.scrim{position:fixed;inset:0;z-index:80;background:rgba(40,25,8,.42);backdrop-filter:blur(3px);display:grid;place-items:center;padding:16px;animation:fade .2s ease both}
@keyframes fade{from{opacity:0}}
.modal{width:100%;max-width:560px;max-height:calc(100vh - 32px);overflow:auto;border-radius:26px;padding:24px;border:1.5px solid transparent;
  background:linear-gradient(var(--surface),var(--surface)) padding-box,linear-gradient(150deg,#fff,#d6a548 40%,#b8bdc5 80%,#fff) border-box;box-shadow:var(--sh-lg);
  animation:pop .32s var(--spring) both}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}}
.modal h3{margin:0 0 14px;font-family:var(--serif);font-weight:600;font-size:1.2rem}
.modal .actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;flex-wrap:wrap}
.toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:99;display:grid;gap:8px;width:min(92vw,420px)}
.toast{padding:12px 16px;border-radius:14px;color:#fff;font-weight:500;box-shadow:var(--sh-lg);display:flex;gap:10px;align-items:center;animation:pop .3s var(--spring) both;
  background:linear-gradient(180deg,#3a2f22,#231b12);border:1px solid rgba(201,151,47,.5)}
.toast.err{background:linear-gradient(180deg,#d9504a,#b02f2f);border-color:rgba(255,200,200,.5)}
.toast.ok{background:linear-gradient(180deg,#26a96a,#0f7d4b);border-color:rgba(200,255,220,.5)}
.loading{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:rgba(246,240,230,.55);backdrop-filter:blur(2px)}
.spinner{width:46px;height:46px;border-radius:50%;background:conic-gradient(from 0deg,transparent,#e0701c,#e8c36a,transparent 75%);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.skeleton{height:140px;border-radius:var(--r);background:linear-gradient(90deg,#f3eadb 0%,#fbf5ea 40%,#f3eadb 80%);background-size:200% 100%;animation:sk 1.3s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
.view-in{animation:viewin .45s var(--spring) both}
@keyframes viewin{from{opacity:0;transform:translateY(8px)}}

.menu{position:absolute;right:16px;top:60px;z-index:40;min-width:230px;padding:8px;border-radius:18px;border:1px solid transparent;
  background:linear-gradient(#fffdf8,#fffdf8) padding-box,var(--edge) border-box;box-shadow:var(--sh-lg);animation:pop .25s var(--spring) both;transform-origin:top right}
.menu .who{padding:8px 12px 10px;border-bottom:1px solid var(--line);margin-bottom:6px}
.menu button{display:flex;width:100%;gap:10px;align-items:center;border:0;background:transparent;padding:10px 12px;border-radius:11px;cursor:pointer;text-align:left}
.menu button:hover{background:var(--surface-3)}
.menu svg{width:18px;height:18px;color:var(--orange-2)}

.notice{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:16px;background:var(--gold-soft);border:1px solid rgba(201,151,47,.45);color:#5b4310}
.notice svg{width:22px;height:22px;flex:none;color:var(--gold)}
.notice.red{background:var(--red-soft);border-color:rgba(207,59,59,.35);color:#7d1f1f}
.notice.red svg{color:var(--red)}

.layout-2{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:18px;align-items:start;margin-top:18px}
@media(max-width:960px){.layout-2{grid-template-columns:1fr}}
.layout-2 .card+.card{margin-top:18px}
.det{font-size:.88rem;color:var(--ink-2);margin-top:4px}
.hist{display:grid;gap:8px}
.hist .it{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:13px;background:var(--surface-2);border:1px solid var(--line)}
.hist .d{flex:none;width:52px;text-align:center;border-radius:11px;padding:4px 0;background:#fff;border:1px solid var(--line);line-height:1.15}
.hist .d b{display:block;font-size:1.15rem;font-variant-numeric:tabular-nums}
.hist .d span{font-size:.7rem;color:var(--muted)}

.print-only,#print-area{display:none}
@media print{
  @page{size:A4;margin:11mm 10mm}
  body{background:#fff!important;font-size:13.5px;line-height:1.35;color:#000}
  .topbar,.nav,.no-print,.toasts,.menu,.scrim,.loading{display:none!important}
  main{padding:0;max-width:none}
  .screen-only{display:none!important}
  .print-only{display:block!important}
  body.print-x #app{display:none!important}
  body.print-x #print-area{display:block!important}
  .ptable{width:100%;border-collapse:collapse;table-layout:fixed}
  .ptable th,.ptable td{border:1px solid #444;padding:5px 6px;vertical-align:top;text-align:left;word-wrap:break-word}
  .ptable th{background:#f0e6d2!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;vertical-align:middle;text-align:center}
  .ptable td.c{text-align:center}
  .ptable tr{break-inside:avoid;page-break-inside:avoid}
  .ptable thead{display:table-header-group}
  .ptable img.psig{height:38px;max-width:100%;object-fit:contain;display:block;margin:0 auto}
  .pphs{display:grid;grid-template-columns:1fr 1fr;gap:4px}
  .ptable img.pph{width:100%;height:78px;object-fit:cover;border-radius:3px;border:1px solid #bbb}
  .pitem+.pitem{margin-top:5px}
  .pmuted{color:#666;font-size:.9em}
  .ptag-p{display:inline-block;margin-top:3px;font-size:.85em;border:1px solid #999;border-radius:3px;padding:0 4px}
  .phead{text-align:center;margin-bottom:8px}
  .phead .plogo{width:62px;height:62px;object-fit:contain;display:block;margin:0 auto 4px}
  .phead h2{margin:0;font-family:var(--serif);font-size:19px}
  .psum{margin:6px 0 8px;font-size:.95em}
  .psign{display:flex;justify-content:flex-end;margin-top:30px;break-inside:avoid}
  .psign.two{justify-content:space-around}
  .psign div{text-align:center;width:300px;line-height:1.9}
  .pfoot{margin-top:18px;font-size:.8em;color:#777;text-align:right}
}
/* ---------- v3: cropper ---------- */
.cropper{position:relative;width:min(320px,78vw);aspect-ratio:1;margin:0 auto;overflow:hidden;border-radius:22px;background:#1b140c;touch-action:none;cursor:grab;box-shadow:var(--sh-md);user-select:none}
.cropper.grab{cursor:grabbing}
.cropper canvas{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none;will-change:transform}
.crop-mask{position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 999px rgba(20,12,4,.55);outline:2px solid rgba(255,240,200,.9);pointer-events:none}
/* ---------- v2: avatar / photos / logo ---------- */
.avatar.has-img{overflow:hidden;background:#fff}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.avatar.sm{width:32px;height:32px;font-size:.85rem;flex:none}
.avatar.xl{width:72px;height:72px;font-size:1.8rem;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 0 0 3px rgba(255,255,255,.9),0 0 0 5px rgba(232,195,106,.85),0 10px 22px -8px rgba(80,30,0,.6)}
.avatar.xxl{width:136px;height:136px;font-size:3.2rem;margin:0 auto;box-shadow:0 0 0 4px #fff,0 0 0 6px rgba(201,151,47,.7),var(--sh-md)}
.hero-av{position:relative;border:0;background:none;padding:0;cursor:pointer;flex:none;border-radius:50%;transition:transform .15s var(--spring)}
.hero-av:active{transform:scale(.96)}
.hero-av .cam{position:absolute;right:-2px;bottom:-2px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--metal-gold);color:#3d2a05;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.hero-av .cam svg{width:15px;height:15px}
.pslots{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.pslots{grid-template-columns:1fr}}
.pslot{position:relative;border-radius:16px;min-height:180px;overflow:hidden}
.pslot.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px;border:1.5px dashed rgba(201,151,47,.65);background:linear-gradient(180deg,#fffdf8,#fbf3e3);transition:background .2s,border-color .2s}
.pslot.empty.over{border-color:var(--orange);background:var(--orange-soft)}
.pico{width:50px;height:50px;border-radius:15px;display:grid;place-items:center;background:var(--metal-gold);color:#3d2a05;margin-bottom:6px;box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 4px 10px -4px rgba(120,80,0,.6)}
.pico svg{width:25px;height:25px}
.pslot.filled{border:1px solid var(--line-2);box-shadow:var(--sh-md);background:#1b140c}
.pthumb{display:block;border:0;padding:0;margin:0;background:none;cursor:zoom-in;width:100%}
.pslot.filled .pthumb img{width:100%;height:210px;object-fit:cover;display:block}
.ptag{position:absolute;left:10px;bottom:10px;font-size:.82rem;font-weight:600;color:#fff;padding:2px 11px;border-radius:999px;background:rgba(0,0,0,.45);backdrop-filter:blur(4px)}
.prm{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;border:2px solid #fff;display:grid;place-items:center;cursor:pointer;color:#fff;background:linear-gradient(180deg,#f07a72,#c73434);box-shadow:0 2px 8px rgba(0,0,0,.35)}
.prm svg{width:16px;height:16px}
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pgrid .pthumb{border-radius:14px;overflow:hidden;border:1px solid var(--line-2);box-shadow:var(--sh-sm)}
.pgrid img{width:100%;height:190px;object-fit:cover;display:block}
.mini-ph{display:flex;gap:6px;margin-top:6px}
.mini-ph .pthumb{width:68px;height:50px;border-radius:9px;overflow:hidden;border:1px solid var(--line-2);box-shadow:var(--sh-sm)}
.mini-ph img{width:100%;height:100%;object-fit:cover;display:block}
.zoom img{max-width:100%;max-height:72vh;border-radius:14px;display:block;margin:0 auto}
img.broken{opacity:.25}
.b-back{color:#6b4a00;background:var(--gold-soft);border:1px solid rgba(201,151,47,.5)}
.logo-wrap{display:inline-block;position:relative;flex:none}
.logo-wrap img{width:100%;height:100%;object-fit:contain;display:block}
.logo-wrap svg{display:none;width:100%;height:100%}
.logo-wrap.nologo img{display:none}.logo-wrap.nologo svg{display:block}
.emblem{width:46px;height:46px}
.login .emblem{width:118px;height:118px}

:focus-visible{outline:3px solid rgba(224,112,28,.45);outline-offset:2px}

function toast(msg,type=''){
  const t=document.createElement('div'); t.className='toast '+type;
  t.innerHTML=(type==='ok'?ic('check','width="18" height="18"'):type==='err'?ic('info','width="18" height="18"'):'')+`<span>${esc(msg)}</span>`;
  $('#toasts').appendChild(t); setTimeout(()=>{t.style.transition='opacity .3s';t.style.opacity=0;setTimeout(()=>t.remove(),300)},3200);

let loadingCount=0;
function loading(on){
  loadingCount+=on?1:-1; let el=$('#loading');
  if(loadingCount>0&&!el){el=document.createElement('div');el.id='loading';el.className='loading';el.innerHTML='<div class="spinner"></div>';document.body.appendChild(el);}
  if(loadingCount<=0){loadingCount=0;el&&el.remove();}
}
function modal(html,{wide=false}={}){
  return new Promise(res=>{
    const s=document.createElement('div'); s.className='scrim';
    s.innerHTML=`<div class="modal" role="dialog" aria-modal="true" ${wide?'style="max-width:760px"':''}>${html}</div>`;
    document.body.appendChild(s);
    const close=v=>{s.remove();document.removeEventListener('keydown',kd);res(v)};
    const kd=e=>{if(e.key==='Escape')close(null)};
    document.addEventListener('keydown',kd);
    s.addEventListener('click',e=>{ if(e.target===s) close(null); const b=e.target.closest('[data-close]'); if(b) close(b.dataset.close==='ok'?s:null); });
    s._close=close; const f=s.querySelector('input,select,textarea'); f&&setTimeout(()=>f.focus(),60);
  });
}
function confirmBox(msg,okText='ยืนยัน',danger=true){
  return modal(`<h3>ยืนยันการทำรายการ</h3><p style="margin:0;color:var(--ink-2)">${msg}</p>
    <div class="actions"><button class="btn btn-ghost" data-close>ยกเลิก</button><button class="btn ${danger?'btn-danger':'btn-primary'}" data-close="ok">${okText}</button></div>`).then(Boolean);
}
function formModal(title,body,okText='บันทึก',onSubmit){
  const s=document.createElement('div'); s.className='scrim';
  s.innerHTML=`<div class="modal" role="dialog" aria-modal="true"><h3>${title}</h3><form novalidate>${body}
    <div class="actions"><button type="button" class="btn btn-ghost" data-x>ยกเลิก</button><button class="btn btn-primary">${okText}</button></div></form></div>`;
  document.body.appendChild(s);
  const close=()=>{s.remove();document.removeEventListener('keydown',kd)}; const kd=e=>{if(e.key==='Escape')close()};
  document.addEventListener('keydown',kd);
  s.addEventListener('click',e=>{if(e.target===s||e.target.closest('[data-x]'))close()});
  const form=s.querySelector('form');
  form.addEventListener('submit',async e=>{e.preventDefault(); const ok=await onSubmit(form); if(ok!==false) close();});
  const f=form.querySelector('input:not([type=hidden]),select'); f&&setTimeout(()=>f.focus(),60);
  return form;
}

/* ---------- API ---------- */
async function api(action,data={},{silent=false,quiet=false}={}){
  if(!silent) loading(true);
  try{
    let res;
    if(DEMO){ await new Promise(r=>setTimeout(r,220)); res = Demo.call(action,{...data,token:S.token}); }
    else{
      const r = await fetch(API_URL,{method:'POST',body:JSON.stringify({action,token:S.token,...data}),redirect:'follow'});
      res = await r.json();
    }
    if(!res.ok){
      if(res.error==='SESSION_EXPIRED'){ toast('หมดเวลาการเข้าสู่ระบบ กรุณาเข้าสู่ระบบใหม่','err'); logout(true); throw new Error('expired'); }
      throw new Error(res.error||'เกิดข้อผิดพลาด');
    }
    return res;
  }catch(err){
    if(err.message!=='expired' && !quiet) toast(err.message==='Failed to fetch'?'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ กรุณาตรวจสอบอินเทอร์เน็ต':err.message,'err');
    throw err;
  }finally{ if(!silent) loading(false); }
}

async function doLogin(cid,pw){

function renderSlots(){
  const box=$('#pslots'); if(!box) return;
  box.innerHTML=[0,1].map(i=>{ const p=S.ph[i];
    if(p) return `<div class="pslot filled"><button type="button" class="pthumb" data-zoom="${esc(p.keep||p.data)}">${p.keep?dimg(p.keep,700,'','ภาพที่ '+(i+1)):`<img src="${p.data}" alt="ภาพที่ ${i+1}">`}</button>
      <span class="ptag">ภาพที่ ${i+1}</span><button type="button" class="prm" data-prm="${i}" aria-label="ลบภาพที่ ${i+1}">${ic('x')}</button></div>`;
    if(i>0 && !S.ph[0]) return '';
    return `<div class="pslot empty" data-drop="${i}"><div class="pico">${ic('camera')}</div><div style="font-weight:600">ภาพที่ ${i+1}</div><div class="hint">ลากไฟล์มาวาง หรือเลือกด้านล่าง</div>
      <div class="row" style="justify-content:center;margin-top:10px;gap:8px">
        <label class="btn btn-primary btn-sm">${ic('camera')}ถ่ายภาพ<input type="file" accept="image/*" capture="environment" data-pi="${i}" hidden></label>
        <label class="btn btn-silver btn-sm">${ic('image')}เลือกรูป / ไฟล์<input type="file" accept="image/*" data-pi="${i}" hidden></label></div></div>`;
  }).join('');
  $$('[data-pi]',box).forEach(inp=>inp.onchange=()=>{ const f=inp.files&&inp.files[0]; if(f) addPhoto(+inp.dataset.pi,f); });
  $$('[data-prm]',box).forEach(b=>b.onclick=()=>{ S.ph.splice(+b.dataset.prm,1); renderSlots(); });
  $$('[data-drop]',box).forEach(z=>{
    z.ondragover=e=>{e.preventDefault();z.classList.add('over')}; z.ondragleave=()=>z.classList.remove('over');
    z.ondrop=e=>{e.preventDefault();z.classList.remove('over'); const f=e.dataTransfer.files&&e.dataTransfer.files[0]; f&&addPhoto(+z.dataset.drop,f);};
  });

async function addPhoto(i,file){
  try{ loading(true); const data=await shrinkImage(file,1600,.82); if(S.ph.length<i) i=S.ph.length; S.ph[i]={data}; S.ph=S.ph.filter(Boolean).slice(0,2); renderSlots(); }
  catch(e){ toast(e.message,'err'); } finally{ loading(false); }
}
function loadImg(file){
  if(file.type && !/^image\//.test(file.type)) return Promise.reject(new Error('กรุณาเลือกไฟล์รูปภาพ'));
  const url=URL.createObjectURL(file);
  return new Promise((res,rej)=>{const im=new Image(); im.onload=()=>res({im,url}); im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('เปิดไฟล์รูปนี้ไม่ได้ — กรุณาใช้ไฟล์ JPG หรือ PNG'))}; im.src=url;});
}
async function shrinkImage(file,max=1600,q=.82){
  const {im,url}=await loadImg(file);
  try{ let w=im.naturalWidth,h=im.naturalHeight; const sc=Math.min(1,max/Math.max(w,h)); w=Math.round(w*sc); h=Math.round(h*sc);
    const c=document.createElement('canvas'); c.width=w; c.height=h; const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,w,h); x.drawImage(im,0,0,w,h);
    let out=c.toDataURL('image/jpeg',q); while(out.length>1400000 && q>.4){ q-=.1; out=c.toDataURL('image/jpeg',q); } return out;
  }finally{ URL.revokeObjectURL(url); }
}
async function shrinkSquare(file,size=360){
  const {im,url}=await loadImg(file);
  try{ const s=Math.min(im.naturalWidth,im.naturalHeight); const c=document.createElement('canvas'); c.width=c.height=size; const x=c.getContext('2d');
    x.drawImage(im,(im.naturalWidth-s)/2,(im.naturalHeight-s)/2,s,s,0,0,size,size); return c.toDataURL('image/jpeg',.86);
  }finally{ URL.revokeObjectURL(url); }
}

  $('#cancel-edit')&&($('#cancel-edit').onclick=onCancel);
  $$('.duty',f).forEach(d=>d.addEventListener('change',e=>{ if(e.target.type==='radio'){ const no=e.target.value===RESULT_NO; d.querySelector('.reason').classList.toggle('hidden',!no); no&&d.querySelector('[name=reason]').focus(); }}));
  f.addEventListener('submit',async e=>{
    e.preventDefault();
    const items=$$('.duty',f).map(d=>({point_id:d.dataset.pid,result:d.querySelector('input[type=radio]:checked').value,reason:d.querySelector('[name=reason]').value.trim(),note:d.querySelector('[name=note]').value.trim()}));

    const signature=pad.export();

  });

async function viewBack(){

  if(!S.back.date){
    try{ if(!S.home) S.home=await api('home',{}, {silent:true}); }catch(e){}
    S.back.date=(S.home&&S.home.missing&&S.home.missing[0]&&S.home.missing[0].date)||addDays(bkkDate(),-1);

  try{ S.back.data=await api('myDay',{date:S.back.date},{silent:!!S.back.data}); }catch(e){ return setView(errorBox()); }

/* ================= IMAGES & AVATAR ================= */
const IMGC={};
const imgUrl=(id,w)=> id.startsWith('data:') ? id : (IMGC[id] || `https://drive.google.com/thumbnail?id=${encodeURIComponent(id)}&sz=w${w}`);
const dimg=(id,w,cls='',alt='',lazy=true)=>`<img class="${cls}" src="${esc(imgUrl(id,w))}" data-fid="${esc(id)}" alt="${esc(alt)}" loading="${lazy?'lazy':'eager'}" referrerpolicy="no-referrer" onerror="imgFallback(this)">`;
function imgFallback(el){
  const id=el.dataset.fid; if(!id||el.dataset.fb||id.startsWith('data:')) return; el.dataset.fb='1';
  if(IMGC[id]){ el.src=IMGC[id]; return; }
  api('getImage',{id},{silent:true,quiet:true}).then(r=>{ IMGC[id]=r.data; $$(`img[data-fid="${CSS.escape(id)}"]`).forEach(i=>{i.dataset.fb='1';i.src=r.data}); }).catch(()=>el.classList.add('broken'));
}
function avatarEl(u,cls='avatar'){
  return u&&u.avatar ? `<span class="${cls} has-img">${dimg(u.avatar,240,'','รูปโปรไฟล์')}</span>` : `<span class="${cls}">${esc(initials(u&&u.name))}</span>`;

/** รอให้รูปทั้งหมดในส่วนพิมพ์โหลดเสร็จ (รวมรูปที่ต้องดึงผ่าน API) แล้วค่อยสั่งพิมพ์ */
async function doPrint(rootSel){
  const imgs=$$(rootSel+' img');
  imgs.forEach(i=>{ if(i.loading==='lazy') i.loading='eager'; if(i.complete && !i.naturalWidth) imgFallback(i); });
  loading(true);
  const t0=Date.now();
  const pending=()=>imgs.filter(i=>!(i.complete&&i.naturalWidth) && !i.classList.contains('broken'));
  while(Date.now()-t0<12000 && pending().length){ await new Promise(r=>setTimeout(r,250)); pending().forEach(i=>{ if(i.complete&&!i.naturalWidth) imgFallback(i); }); }
  loading(false);
  if(pending().length) toast('รูปบางภาพยังโหลดไม่เสร็จ — ระบบจะพิมพ์เท่าที่โหลดได้');
  setTimeout(()=>window.print(),120);
}

/* ---------- Avatar cropper ---------- */
async function fileToCanvas(file,max=1600){
  const {im,url}=await loadImg(file);
  try{ const sc=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight)); const c=document.createElement('canvas');
    c.width=Math.round(im.naturalWidth*sc); c.height=Math.round(im.naturalHeight*sc); c.getContext('2d').drawImage(im,0,0,c.width,c.height); return c; }
  finally{ URL.revokeObjectURL(url); }
}
function cropDialog(file){
  return new Promise(async resolve=>{
    let img; try{ img=await fileToCanvas(file,1600); }catch(e){ toast(e.message,'err'); return resolve(null); }
    let finished=false;
    modal(`<h3>ปรับตำแหน่งรูปโปรไฟล์</h3>
      <div class="cropper" id="crp"><canvas id="crp-cv"></canvas><div class="crop-mask"></div></div>
      <div class="row" style="gap:10px;margin-top:16px;flex-wrap:nowrap;max-width:340px;margin-inline:auto">
        <button type="button" class="btn btn-ghost btn-icon" id="crp-out" aria-label="ย่อ">${ic('minus')}</button>
        <input type="range" id="crp-z" min="1" max="4" step="0.01" value="1" style="flex:1;accent-color:var(--orange)" aria-label="ซูม">
        <button type="button" class="btn btn-ghost btn-icon" id="crp-in" aria-label="ขยาย">${ic('plus')}</button>
        <button type="button" class="btn btn-silver btn-icon" id="crp-rot" title="หมุน 90°" aria-label="หมุนภาพ">${ic('rotate')}</button></div>
      <div class="hint" style="text-align:center;margin-top:8px">ลากเพื่อเลื่อนภาพ · ใช้แถบ ล้อเมาส์ หรือสองนิ้วเพื่อซูม</div>
      <div class="actions"><button class="btn btn-ghost" data-close>ยกเลิก</button><button class="btn btn-primary" id="crp-ok">${ic('check')}ใช้รูปนี้</button></div>`).then(()=>{ if(!finished) resolve(null); });
    const sc=$$('.scrim').pop(), box=$('#crp',sc), cv=$('#crp-cv',sc), zr=$('#crp-z',sc);
    let V,base,s,tx,ty;
    const clamp=()=>{ const w=img.width*s,h=img.height*s; tx=Math.min(0,Math.max(V-w,tx)); ty=Math.min(0,Math.max(V-h,ty)); };
    const apply=()=>{ clamp(); cv.style.transform=`translate(${tx}px,${ty}px) scale(${s})`; };
    const setup=()=>{ V=box.clientWidth; cv.width=img.width; cv.height=img.height; cv.getContext('2d').drawImage(img,0,0);
      base=Math.max(V/img.width,V/img.height); s=base; tx=(V-img.width*s)/2; ty=(V-img.height*s)/2; zr.value=1; apply(); };
    const zoomTo=(ns,px=V/2,py=V/2)=>{ ns=Math.max(base,Math.min(base*4,ns)); tx=px-(px-tx)*ns/s; ty=py-(py-ty)*ns/s; s=ns; zr.value=s/base; apply(); };
    setup();
    zr.oninput=()=>zoomTo(base*zr.value);
    $('#crp-in',sc).onclick=()=>zoomTo(s*1.2); $('#crp-out',sc).onclick=()=>zoomTo(s/1.2);
    $('#crp-rot',sc).onclick=()=>{ const c=document.createElement('canvas'); c.width=img.height; c.height=img.width; const x=c.getContext('2d'); x.translate(c.width,0); x.rotate(Math.PI/2); x.drawImage(img,0,0); img=c; setup(); };
    box.addEventListener('wheel',e=>{ e.preventDefault(); const r=box.getBoundingClientRect(); zoomTo(s*Math.exp(-e.deltaY*.0015),e.clientX-r.left,e.clientY-r.top); },{passive:false});
    const P=new Map(); let last=null;
    const mid=()=>{ const a=[...P.values()]; const r=box.getBoundingClientRect(); return {x:(a[0].x+a[1].x)/2-r.left,y:(a[0].y+a[1].y)/2-r.top,d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}; };
    box.addEventListener('pointerdown',e=>{ box.setPointerCapture(e.pointerId); P.set(e.pointerId,{x:e.clientX,y:e.clientY}); last=P.size===2?mid():null; box.classList.add('grab'); });
    box.addEventListener('pointermove',e=>{ if(!P.has(e.pointerId)) return; const p=P.get(e.pointerId);
      if(P.size===1){ tx+=e.clientX-p.x; ty+=e.clientY-p.y; apply(); P.set(e.pointerId,{x:e.clientX,y:e.clientY}); }
      else if(P.size===2){ P.set(e.pointerId,{x:e.clientX,y:e.clientY}); const m=mid(); if(last){ tx+=m.x-last.x; ty+=m.y-last.y; zoomTo(s*m.d/last.d,m.x,m.y); } last=m; } });
    const up=e=>{ P.delete(e.pointerId); last=P.size===2?mid():null; if(!P.size) box.classList.remove('grab'); };
    box.addEventListener('pointerup',up); box.addEventListener('pointercancel',up);
    $('#crp-ok',sc).onclick=()=>{ const o=document.createElement('canvas'); o.width=o.height=400; const x=o.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,400,400);
      x.drawImage(img,-tx/s,-ty/s,V/s,V/s,0,0,400,400); finished=true; resolve(o.toDataURL('image/jpeg',.88)); sc._close(); };
  });
}

/* ---------- Signature pad ---------- */
class SigPad{
  constructor(cv,onChange){
    this.cv=cv; this.ctx=cv.getContext('2d'); this.onChange=onChange; this.empty=true; this.strokes=[];
    this.resize(); this.ro=new ResizeObserver(()=>this.resize()); this.ro.observe(cv);
    cv.addEventListener('pointerdown',e=>this.down(e)); cv.addEventListener('pointermove',e=>this.move(e));
    ['pointerup','pointercancel','pointerleave'].forEach(t=>cv.addEventListener(t,()=>this.up()));
  }
  resize(){ const r=this.cv.getBoundingClientRect(); if(!r.width) return; const dpr=Math.max(1,window.devicePixelRatio||1);
    this.cv.width=Math.round(r.width*dpr); this.cv.height=Math.round(r.height*dpr); this.dpr=dpr; this.redraw(); }
  pt(e){ const r=this.cv.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top,p:e.pressure&&e.pointerType==='pen'?e.pressure:.5}; }
  down(e){ e.preventDefault(); this.cv.setPointerCapture(e.pointerId); this.cur=[this.pt(e)]; this.strokes.push(this.cur); this.redraw(); }
  move(e){ if(!this.cur) return; e.preventDefault(); const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e]; evs.forEach(ev=>this.cur.push(this.pt(ev))); this.redraw();
    if(this.empty&&this.cur.length>2){this.empty=false;this.onChange&&this.onChange();} }
  up(){ if(this.cur&&this.cur.length&&this.empty){this.empty=false;this.onChange&&this.onChange();} this.cur=null; }
  clear(){ this.strokes=[]; this.empty=true; this.redraw(); }
  draw(ctx,scale,ox=0,oy=0){
    ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#1c2547';
    this.strokes.forEach(s=>{ if(!s.length) return; ctx.lineWidth=2.6*scale; ctx.beginPath();
      const P=s.map(p=>({x:(p.x-ox)*scale,y:(p.y-oy)*scale}));
      ctx.moveTo(P[0].x,P[0].y);
      if(P.length<3){ ctx.lineTo(P[0].x+.1,P[0].y+.1); }
      for(let i=1;i<P.length-1;i++){ const mx=(P[i].x+P[i+1].x)/2,my=(P[i].y+P[i+1].y)/2; ctx.quadraticCurveTo(P[i].x,P[i].y,mx,my); }
      if(P.length>=3) ctx.lineTo(P[P.length-1].x,P[P.length-1].y);
      ctx.stroke(); });
  }
  redraw(){ const c=this.ctx; c.setTransform(1,0,0,1,0,0); c.clearRect(0,0,this.cv.width,this.cv.height); this.draw(c,this.dpr); }
  export(){
    let x1=1e9,y1=1e9,x2=-1e9,y2=-1e9; this.strokes.flat().forEach(p=>{x1=Math.min(x1,p.x);y1=Math.min(y1,p.y);x2=Math.max(x2,p.x);y2=Math.max(y2,p.y)});
    const pad=6; x1-=pad;y1-=pad;x2+=pad;y2+=pad; const w=x2-x1,h=y2-y1;
    for(const maxW of [420,320,240]){
      const sc=Math.min(maxW/w,140/h,1.6); const o=document.createElement('canvas'); o.width=Math.ceil(w*sc); o.height=Math.ceil(h*sc);
      this.draw(o.getContext('2d'),sc,x1,y1); const url=o.toDataURL('image/png'); if(url.length<45000) return url;
    }
    return null;
  }
}

      <td>${r.report?esc(r.report.result)+(r.report.backdate?'<div class="ptag-p">บันทึกย้อนหลัง</div>':r.report.late?'<div class="ptag-p">ส่งล่าช้า</div>':''):'<i>ไม่ได้รายงาน</i>'}</td>

}

      <td style="text-align:right;white-space:nowrap"><button class="btn btn-ghost btn-icon" data-ue="${u.cid}" title="แก้ไข">${ic('edit','width="16" height="16"')}</button>
      <button class="btn btn-ghost btn-icon" data-ud="${u.cid}" title="ลบ">${ic('trash','width="16" height="16"')}</button></td></tr>`).join('')||`<tr><td colspan="6"><div class="empty">ไม่พบผู้ใช้</div></td></tr>`}

function userForm(u){

      <div id="dayw"><label class="f">วันที่ดูแล (แอดมินประจำวัน)</label><select class="input" name="admin_day">${[1,2,3,4,5].map(d=>`<option value="${d}" ${u?.admin_day===d?'selected':''}>วัน${DAY_TH[d]}</option>`).join('')}</select></div></div>
    ${u&&u.has_pw?`<label class="row" style="gap:8px;cursor:pointer"><input type="checkbox" name="reset_pw"> รีเซ็ตรหัสผ่าน (ผู้ใช้จะเข้าระบบด้วยเลขบัตรเพียงอย่างเดียวและตั้งรหัสใหม่ได้)</label>`:''}
  </div>`,'บันทึก',async f=>{
    try{ const r=await api('saveUser',{original_cid:u?.cid||'',user:{cid:f.cid.value,prefix:f.prefix.value,fname:f.fname.value,lname:f.lname.value,role:f.role.value,admin_day:f.admin_day.value,reset_pw:f.reset_pw?.checked}});
      S.users=r.users; renderUsers(); toast(r.message,'ok'); }catch(e){return false}
  });

/* ================= SCHEDULE ================= */
async function viewSchedule(){
  if(!S.sched.data) skeleton();
  try{ S.sched.data=await api('schedule',{}, {silent:!!S.sched.data}); }catch(e){ return setView(errorBox()); }
  renderSchedule();
}
function renderSchedule(){
  const D=S.sched.data, day=S.sched.day;
  const pts=D.points.filter(p=>p.days.includes(day));
  const per=pid=>D.duties.filter(d=>d.day===day&&d.point_id===pid);
  const teachers=new Set(D.duties.filter(d=>d.day===day).map(d=>d.cid)).size;
  setView(`<div class="card"><div class="card-h"><div><h2>ตารางเวรประจำวัน</h2><div class="sub">เลือกวัน แล้วเพิ่ม/ลบรายชื่อครูในแต่ละจุด — บันทึกอัตโนมัติ</div></div></div>
    <div class="seg" style="margin-bottom:16px">${[1,2,3,4,5].map(d=>`<button data-sd="${d}" class="${d===day?'on':''}">วัน${DAY_TH[d]} <span class="num" style="opacity:.75">(${new Set(D.duties.filter(x=>x.day===d).map(x=>x.cid)).size})</span></button>`).join('')}</div>
    <div class="hint" style="margin-bottom:12px">วัน${DAY_TH[day]}: ${pts.length} จุด · ครูเวร ${teachers} คน</div>
    <datalist id="ulist">${D.users.map(u=>`<option value="${esc(u.name)}">`).join('')}</datalist>
    ${pts.map(p=>{const ds=per(p.id);return `<div class="pgroup"><div class="pgroup-h"><span class="nm">${esc(p.name)}</span><span class="time" style="margin:0">${ic('clock')}${p.start}–${p.end} น.</span>
      ${p.active?'':'<span class="badge b-user">ปิดใช้งาน</span>'}<span class="hint num">${ds.length} คน</span></div>
      <div style="padding:12px 14px"><div class="chips">${ds.map(d=>`<span class="chip">${esc(d.name)}<button data-rm="${p.id}|${d.cid}" aria-label="นำออก">${ic('x')}</button></span>`).join('')||'<span class="hint">ยังไม่มีครูในจุดนี้</span>'}</div>
      <form class="row" data-add="${p.id}" style="margin-top:10px"><input class="input" list="ulist" placeholder="พิมพ์ชื่อครูเพื่อเพิ่ม…" style="flex:1;min-width:180px"><button class="btn btn-silver btn-sm">${ic('plus')}เพิ่ม</button></form></div></div>`}).join('')
    ||`<div class="empty">ไม่มีจุดเวรที่ใช้ในวัน${DAY_TH[day]}</div>`}
  </div>`);
  $$('[data-sd]').forEach(b=>b.onclick=()=>{S.sched.day=+b.dataset.sd;renderSchedule()});
  const save=async(pid,cids)=>{ try{ S.sched.data=await api('setDuty',{day,point_id:pid,cids}); renderSchedule(); toast('บันทึกตารางเวรแล้ว','ok'); }catch(e){} };
  $$('[data-rm]').forEach(b=>b.onclick=()=>{const [pid,cid]=b.dataset.rm.split('|'); save(pid,per(pid).map(d=>d.cid).filter(c=>c!==cid));});
  $$('[data-add]').forEach(f=>f.onsubmit=e=>{e.preventDefault(); const v=f.querySelector('input').value.trim(); const u=D.users.find(x=>x.name===v);
    if(!u) return toast('ไม่พบชื่อนี้ในรายชื่อผู้ใช้','err'); const pid=f.dataset.add; const cur=per(pid).map(d=>d.cid);
    if(cur.includes(u.cid)) return toast('ครูท่านนี้อยู่ในจุดนี้แล้ว','err'); save(pid,[...cur,u.cid]);});
}

  const sample=(hue,label)=>draw(800,560,(x,w,h)=>{const g=x.createLinearGradient(0,0,w,h);g.addColorStop(0,`hsl(${hue},55%,62%)`);g.addColorStop(1,`hsl(${hue+30},45%,38%)`);x.fillStyle=g;x.fillRect(0,0,w,h);
    x.fillStyle='rgba(255,255,255,.18)';for(let i=0;i<6;i++){x.beginPath();x.arc(120+i*130,h-90-(i%2)*60,60+i*6,0,7);x.fill()}x.fillStyle='#fff';x.font='bold 44px sans-serif';x.fillText(label,40,80);});

      my.forEach(d=>{const it=q.items.find(x=>x.point_id===d.point_id);const i=reps.findIndex(r=>r.cid===u.cid&&r.date===date&&r.point_id===d.point_id);
        const r={id:'R'+Math.random().toString(36).slice(2,8),date,cid:u.cid,name:fn(u),day:wdOf(date),point_id:d.point_id,point_name:d.point.name,result:it.result,reason:it.reason,note:it.note,signature:q.signature,submitted_at:T+' '+now(),late,photos,backdate:back};
        if(i>-1){r.id=reps[i].id;r.backdate=reps[i].backdate||back;reps[i]=r}else reps.push(r)});
      return{...(back?myDay(u,date):home(u)),message:back?'บันทึกรายงานย้อนหลังเรียบร้อย':late?'บันทึกรายงานเรียบร้อย (ส่งหลังเวลาที่กำหนด)':'บันทึกรายงานเรียบร้อย'}},
    dayReport(q){const u=me(q.token);const date=q.date||T,wd=wdOf(date);if(u.role!=='admin'&&(u.role!=='dayadmin'||wd!==u.admin_day))throw new Error('คุณดูรายงานได้เฉพาะวัน'+DAY_TH[u.admin_day]+'เท่านั้น');
      const l=forDate(date),r=reps.filter(x=>x.date===date),bt={};l.forEach(d=>(bt[d.cid]=bt[d.cid]||[]).push(d));const ts={},td={};
      Object.keys(bt).forEach(c=>{td[c]=dl(bt[c]);ts[c]=status(date,bt[c],r.filter(x=>x.cid===c),td[c])});
      const rows=l.map(d=>{const rp=r.find(x=>x.cid===d.cid&&x.point_id===d.point_id)||null;const uu=users.find(x=>x.cid===d.cid);return{point_id:d.point_id,point_name:d.point.name,start:d.point.start,end:d.point.end,cid:d.cid,name:fn(uu),avatar:uu.avatar,status:rp?'done':ts[d.cid],deadline:td[d.cid],report:rp}});
      const sm={teachers:0,done:0,pending:0,overdue:0,upcoming:0,points:l.length,reported_points:rows.filter(x=>x.report).length};Object.values(ts).forEach(s=>{sm.teachers++;sm[s]++});
      return{date,weekday:wd,weekday_label:DAY_TH[wd],holiday:hol.find(h=>h.date===date)||null,settings:pubSt(),heads:users.filter(x=>x.role==='dayadmin'&&x.admin_day===wd).map(fn),rows,summary:sm,server_time:now(),today:T}},
    users(){return{users:users.map(pub)}},
    saveUser(q){const x=q.user;if(String(x.cid).length!==13)throw new Error('เลขบัตรประชาชนต้องมี 13 หลัก');let u=users.find(v=>v.cid===q.original_cid);
      if(!u){if(users.some(v=>v.cid===x.cid))throw new Error('มีเลขบัตรประชาชนนี้ในระบบแล้ว');u={pw:'',avatar:''};users.push(u)}
      Object.assign(u,{cid:x.cid,prefix:x.prefix,fname:x.fname,lname:x.lname,role:x.role,admin_day:x.role==='dayadmin'?+x.admin_day:0});if(x.reset_pw)u.pw='';return{users:users.map(pub),message:'บันทึกข้อมูลผู้ใช้เรียบร้อย'}},
    deleteUser(q){const i=users.findIndex(u=>u.cid===q.cid);users.splice(i,1);for(let k=duties.length-1;k>=0;k--)if(duties[k].cid===q.cid)duties.splice(k,1);return{users:users.map(pub),message:'ลบผู้ใช้เรียบร้อย'}},
    points(){return{points:pts}},
    savePoint(q){const p=q.point;let x=pts.find(v=>v.id===p.id);if(!x){x={id:'P'+(pts.length+20)};pts.push(x)}Object.assign(x,{name:p.name,start:p.start,end:p.end,days:p.days,order:+p.order,active:p.active});pts.sort((a,b)=>a.order-b.order);return{points:pts,message:'บันทึกจุดเวรเรียบร้อย'}},
    deletePoint(q){pts.splice(pts.findIndex(p=>p.id===q.id),1);return{points:pts,message:'ลบจุดเวรเรียบร้อย'}},
    schedule(){return{points:pts,duties:duties.map(d=>({...d,name:fn(users.find(u=>u.cid===d.cid))})),users:users.map(u=>({cid:u.cid,name:fn(u)}))}},
    setDuty(q){for(let k=duties.length-1;k>=0;k--)if(duties[k].day===q.day&&duties[k].point_id===q.point_id)duties.splice(k,1);q.cids.forEach(c=>duties.push({day:q.day,point_id:q.point_id,cid:c}));return A.schedule()},
    deleteReport(q){reps.splice(reps.findIndex(r=>r.id===q.id),1);return{message:'ลบรายงานเรียบร้อย'}},
    summary(q){const s={};let days=0;for(let d=q.from;d<=q.to&&d<=T;d=addDays(d,1)){const l=forDate(d);if(l.length)days++;l.forEach(x=>{const u=users.find(v=>v.cid===x.cid);const o=s[x.cid]=s[x.cid]||{cid:x.cid,name:fn(u),assigned:0,reported:0,absent:0,late:0,missed:0,pending:0};
      o.assigned++;const r=reps.find(v=>v.date===d&&v.cid===x.cid&&v.point_id===x.point_id);if(r){o.reported++;if(r.result===RESULT_NO)o.absent++;if(r.late)o.late++}else if(d<T)o.missed++;else o.pending++})}
      return{from:q.from,to:q.to,duty_days:days,rows:Object.values(s).sort((a,b)=>b.missed-a.missed)}},
    settings(){return{settings:st,holidays:hol}},
    saveSettings(q){Object.assign(st,q.settings);return{settings:st,holidays:hol,message:'บันทึกการตั้งค่าเรียบร้อย'}},
    saveHoliday(q){hol.push(q.holiday);hol.sort((a,b)=>a.date.localeCompare(b.date));return{settings:st,holidays:hol,message:'บันทึกวันหยุดเรียบร้อย'}},
    deleteHoliday(q){hol.splice(hol.findIndex(h=>h.date===q.date),1);return{settings:st,holidays:hol,message:'ลบวันหยุดเรียบร้อย'}}
  };
  return {call(action,q){ try{ if(!A[action]) throw new Error('ไม่รู้จักคำสั่ง'); const r=JSON.parse(JSON.stringify(A[action](q))); r.ok=true; return r; }catch(e){ return {ok:false,error:e.message}; } }};
})();
if(DEMO){ store.set('duty_token',null); S.token=null; S.user=null; }

boot();
</script>
